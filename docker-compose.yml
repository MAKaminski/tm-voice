# Local Postgres + Redis for `pnpm dev` when Docker is available. Tests do NOT need this (PGlite in-process).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: tm, POSTGRES_PASSWORD: tm, POSTGRES_DB: tm_voice }
    ports: ["5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: { pg: {} }
